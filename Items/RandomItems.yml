# Requires Crucible, MM 5.8+ and MC 1.21.4+
WarpedMushroom:
  Id: warped_fungus
  Display: '<dark_aqua>Warped Mushroom Snack'
  Lore:
  - '<gray>What could possibly go wrong?'
  Consumable:
    ConsumeSeconds: 1
    HasParticles: true
    Animation: EAT
  Food:
    Nutrition: 5
    Saturation: 5
    CanAlwaysEat: true
  Skills:
  - skill{s=[
    - potion{type=LEVITATION;l=2;d=300}
    - potion{type=SLOW_FALLING;l=1;d=500}
    - delay 40
    - sound{s=entity.enderman.teleport;sc=MASTER;v=1}
    - delay 3
    - randomskill{skills=
      [ teleport{spreadh=10;spreadv=2}] 10 ,
      [ teleport{spreadh=50;spreadv=10}] 30 ,
      [ teleport{spreadh=100;spreadv=20}] 50 } 
    - message{m="<aqua>You feel your reality shifting..."}
    ]} @self ~onConsume

# Requires Crucible, MM 5.8+, LibsDisguises and MC 1.21.4+
# See Skys-Mobs/Skills/RandomItems-Skills.yml for the required skills. 
Creeper_Candy: 
  Material: SUGAR
  Display: '<gradient:#00FF00:#008000>Creeper Candy'
  Lore:
    - "Not your average candy..."
  Hide:
  - enchants
  Enchantments:
  - Unbreaking:1
  UseCooldown:
    CooldownGroup: randomitems
    CooldownSeconds: 15
  Consumable:
    ConsumeSeconds: 1
    HasParticles: true
    Animation: EAT
  Food:
    Nutrition: 2
    Saturation: 2
    CanAlwaysEat: true
  Skills:
    - aura{name=CreeperCandy;duration=1200;interval=10;bartimer=true;bartimertext='<gradient:#00FF00:#008000>Creeper Candy';bartimercolor=GREEN;bartimerstyle=SOLID;
      onStart=[ - disguise{d=creeper} ];
      onTick=[ - sound{s=entity.creeper.hurt;p=1.8;audience=nearby} 0.65 ?moving ];
      onEnd=CreepperCandy_Hide;
      components=[
        - onAttack{onattack=CreeperCandy_Ignite} @self
        - onDamaged{deflectconditions=isPlayer;ondamaged=CreeperCandy_Ignite} @self 
        ]} @self ~onConsume ?!hasaura{aura=CreeperCandy}

#Requires Crucible and Premium MM
BedrockBreaker:
  Id: black_dye
  Group: 'Fun Items'
  Display: '<gradient:#3C3C3C:#FFFFFF>█-------█ Bedrock </gradient><gradient:#FFFFFF:#3C3C3C>Breaker █-------█</gradient>'
  Lore:
  - '               A Tool Of Legends'
  - ' '
  - ' Harness the power of this one-time use'
  - 'item to shatter the unbreakable, breaking'
  - '   a single <color:#3C3C3C>Bedrock &fblock with precision.'
  - '<gradient:#3C3C3C:#FFFFFF>█-------------█-█</gradient><gradient:#FFFFFF:#3C3C3C>-█-------------█</gradient>'
  Skills:
  - skill{sync=true;cd=1;s=[
    - consumeslot{slot=HAND;a=1} @self
    - breakblock{drops=false;useTool=false}
    ]} @targetblock{md=5;blocktype=bedrock} ~onUse ?stringequals{val1=<target.raytrace>;val2="BEDROCK"} ?holding{i=BedrockBreaker;strict=true}

